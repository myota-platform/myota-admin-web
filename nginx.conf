server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1g;
  client_body_timeout 3600s;
  add_header Cache-Control "no-store" always;
  # OSM's tile policy requires a valid HTTP Referer for browser tile requests.
  # strict-origin-when-cross-origin keeps the origin while avoiding path data.
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  location /v1/ {
    proxy_pass http://${MYOTA_GATEWAY_UPSTREAM};
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host myota-admin-web;
  }
  location = /healthz {
    proxy_pass http://${MYOTA_GATEWAY_UPSTREAM}/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host myota-admin-web;
  }
  location / { try_files $uri $uri/ /index.html; }
}
