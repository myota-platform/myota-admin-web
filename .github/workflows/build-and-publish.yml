name: Build and publish admin web image

on:
  push:
    branches: [main, testing, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting for changed frontend files
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run lint
      - name: Check upload regressions, types and production build
        run: |
          npm test
          npm run typecheck
          npm run build
      - name: Install browser regression runtime
        run: npx playwright install --with-deps chromium
      - name: Check catalogue dialogs, geometry editing and deletion regressions
        run: npm run test:e2e
      - name: Retain isolated browser screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-browser-evidence
          path: test-results/
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'testing')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish latest
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'testing') }}
          tags: ghcr.io/myota-platform/myota-admin-web:${{ github.ref_name == 'main' && 'latest' || github.ref_name == 'testing' && format('testing-{0}', github.sha) || format('ci-{0}', github.sha) }}
